name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Decrypted Spotify IPA URL (Dropbox share links accepted)"
        required: true
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]
      remove_plugins:
        description: "Remove every app extension (PlugIns/) from the IPA"
        type: boolean
        default: false
      enable_wireguard:
        description: "Include opt-in app-local WireGuard / proxy (inspected Spotify IPA only)"
        type: boolean
        default: false
      bundle_id:
        description: "Bundle ID must match the signing App ID; extension IDs follow it (empty keeps Spotify's ID)"
        default: ""
        required: false
        type: string

permissions:
  contents: read

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: levibostian/action-hide-sensitive-inputs@39cfbde19b3251728d2357dd0648172d1202c1ee # v1

      - uses: ./.github/actions/setup-theos
        with:
          brew: aria2

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        if: inputs.enable_wireguard
        with:
          go-version-file: WireGuard/go.mod
          cache-dependency-path: WireGuard/go.sum

      - name: Verify pinned Go release
        if: inputs.enable_wireguard
        env:
          GOTOOLCHAIN: local
        run: test "$(go env GOVERSION)" = "go$(awk '$1 == "go" {print $2}' WireGuard/go.mod)"

      - name: Install cyan
        run: python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          mkdir -p ipa
          IPA_URL="$(python3 -B - <<'PY'
          import os
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit
          url = os.environ["IPA_URL"].strip().replace(r"\&", "&")
          parts = urlsplit(url)
          if parts.scheme == "https" and parts.hostname in {"dropbox.com", "www.dropbox.com", "dl.dropboxusercontent.com"}:
              query = [(k, v) for k, v in parse_qsl(parts.query, keep_blank_values=True) if k != "dl"]
              query.append(("dl", "1"))
              url = urlunsplit(parts._replace(netloc="dl.dropboxusercontent.com", query=urlencode(query)))
          print(url)
          PY
          )"
          # Mask the normalized URL too; it can contain a private share token.
          echo "::add-mask::$IPA_URL"
          # Many file hosts throttle each connection and drop long transfers, so fetch in
          # parallel ranges and resume on failure (one connection when ranges aren't served).
          aria2c --console-log-level=error --summary-interval=0 --download-result=hide \
            --max-connection-per-server=8 --split=8 --min-split-size=1M \
            --max-tries=20 --retry-wait=3 --continue=true --allow-overwrite=true \
            --dir=ipa --out=spotify.ipa "$IPA_URL" || {
            echo "::warning::the parallel download failed, fetching on one connection"
            rm -f ipa/spotify.ipa ipa/spotify.ipa.aria2
            curl -fsSL --retry 10 --retry-all-errors --retry-delay 3 -C - -o ipa/spotify.ipa "$IPA_URL"
          }

      - name: Validate Spotify IPA
        id: spotify
        run: python3 -B scripts/validate-ipa.py ipa/spotify.ipa --github-output "$GITHUB_OUTPUT"

      # pipeline.sh reads the flag table out of the IPA (over a minute) only when the one it finds is
      # for another Spotify version, and rebuilds the Live Activity extension only when its inputs changed.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: tweak/Sources/Shared/Flags/SGFlagList.m
          key: flags-${{ steps.spotify.outputs.version }}-${{ hashFiles('scripts/extract-flags.py') }}

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: out/extension
          key: extension-${{ steps.spotify.outputs.version }}-${{ hashFiles('extension/LiveActivity/**', 'tweak/Sources/Shared/LiveActivity/**', 'scripts/build-extension.sh') }}

      - name: Build IPA
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
          WIREGUARD: ${{ inputs.enable_wireguard && '1' || '0' }}
          MAKEFLAGS: -k
        run: |
          set -o pipefail
          if make release IPA=ipa/spotify.ipa NO_PLUGINS=${{ inputs.remove_plugins && '1' || '0' }} 2>&1 | tee "$RUNNER_TEMP/ipa-build.log"; then
            exit 0
          else
            status=$?
          fi
          python3 -B - "$RUNNER_TEMP/ipa-build.log" <<'PY'
          import pathlib
          import re
          import sys
          def escape(text):
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          with open(sys.argv[1], errors="replace") as log:
              for line in log:
                  line = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", line).rstrip()
                  match = re.match(r"^(.*?):(\d+):(?:(\d+):)?\s*(?:fatal )?error:\s*(.*)", line)
                  if match:
                      path, row, column, message = match.groups()
                      if not pathlib.Path(path).is_absolute() and not pathlib.Path(path).is_file():
                          path = str(pathlib.Path("tweak") / path)
                      path = escape(path).replace(",", "%2C").replace(":", "%3A")
                      print(f"::error file={path},line={row}::{escape(message)}")
                  elif re.search(r"error:|Error \d+", line):
                      print(f"::error::{escape(line)}")
          PY
          exit "$status"

      - name: Verify app extensions removed
        if: inputs.remove_plugins
        run: |
          python3 -B - <<'PY'
          from pathlib import Path
          import zipfile
          for ipa in Path("out").glob("*.ipa"):
              with zipfile.ZipFile(ipa) as archive:
                  if any(part == "PlugIns" or part.endswith(".appex")
                         for name in archive.namelist() for part in name.split("/")):
                      raise SystemExit(f"{ipa} still contains an app extension")
              print(f"{ipa}: no app extensions")
          PY

      - run: ccache --show-stats

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: inputs.upload_method != 'filebin'
        with:
          name: vitrine.ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="vitrine-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"
