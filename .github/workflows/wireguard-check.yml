name: WireGuard checks
on:
  workflow_dispatch:
  push:
    paths: ['WireGuard/**', 'tweak/Sources/Shared/WireGuard/**', 'tweak/Sources/Core/SGRebind.h', 'tweak/Sources/Core/SGRebind.m', 'tweak/Sources/App/ModSettings.x', 'tweak/layout/**/Localizable.strings', 'harness/wireguard/**', 'scripts/spotify-transport-scan.py', 'scripts/quick.sh', 'tweak/Makefile', '.github/workflows/wireguard-check.yml']
  pull_request:
    paths: ['WireGuard/**', 'tweak/Sources/Shared/WireGuard/**', 'tweak/Sources/Core/SGRebind.h', 'tweak/Sources/Core/SGRebind.m', 'tweak/Sources/App/ModSettings.x', 'tweak/layout/**/Localizable.strings', 'harness/wireguard/**', 'scripts/spotify-transport-scan.py', 'scripts/quick.sh', 'tweak/Makefile', '.github/workflows/wireguard-check.yml']
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: WireGuard/go.mod
          cache-dependency-path: WireGuard/go.sum
      - run: |
          cd WireGuard
          test "$(go env GOVERSION)" = "go$(awk '$1 == "go" {print $2}' go.mod)"
          go mod verify && go test -race ./...
      - run: python3 -B harness/wireguard/test_transport_scan.py
  apple:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: theos/theos
          ref: 8167f59de02fd32cf45b16bfcb1330dfa5c9974c
          path: theos
          submodules: recursive
          persist-credentials: false
      - run: brew install make dpkg ldid
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: WireGuard/go.mod
          cache-dependency-path: WireGuard/go.sum
      - run: scripts/check-layers.sh && python3 -B scripts/check-strings.py
      - run: bash harness/wireguard/check-connect-chain.sh
      - run: bash harness/wireguard/build-settings.sh
      # Real IPA builds extract their own flags. Never distribute this fixture's tweak.
      - name: Compile-only flag table
        run: |
          printf '#import "Flags.h"\nconst SGFlagDef SGFlagTable[] = {{"fixture", SGFlagBool, 0, 0, 0}};\nconst NSUInteger SGFlagCount = 0;\n' > tweak/Sources/Shared/Flags/SGFlagList.m
      - name: Cache the default build first
        run: |
          gmake -C tweak
          python3 -B harness/wireguard/check-build-mode.py disabled
      - name: Compile source-built WireGuard tweak
        run: |
          gmake -C tweak package WIREGUARD=1
          python3 -B harness/wireguard/check-build-mode.py enabled
      - name: Return to default without cleaning
        run: |
          gmake -C tweak
          python3 -B harness/wireguard/check-build-mode.py disabled
